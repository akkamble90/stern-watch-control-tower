<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0E0E0"/>
      <stop offset="50%" stop-color="#888888"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ADEF"/>
      <stop offset="100%" stop-color="#005B82"/>
    </linearGradient>
  </defs>
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="url(#silver)" stroke-width="4"/>
  <circle cx="50" cy="50" r="42" fill="none" stroke="#1E222D" stroke-width="1"/>
  <!-- Three-Pointed Star -->
  <g fill="url(#silver)">
    <!-- Top Point -->
    <polygon points="50,10 46,47 50,48"/>
    <polygon points="50,10 54,47 50,48" fill="#B0B0B0"/>
    <!-- Bottom Right Point -->
    <polygon points="84.6,70 52.5,52 50,48"/>
    <polygon points="84.6,70 51,55 50,48" fill="#B0B0B0"/>
    <!-- Bottom Left Point -->
    <polygon points="15.4,70 47.5,52 50,48" fill="#B0B0B0"/>
    <polygon points="15.4,70 49,55 50,48"/>
  </g>
  <!-- Inner Center Ring -->
  <circle cx="50" cy="50" r="4" fill="url(#accent)"/>
</svg>
