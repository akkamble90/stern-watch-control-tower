version: '3.8'

services:
  # --- Zookeeper for Kafka ---
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - stern_watch_net

  # --- Apache Kafka Streaming Broker ---
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - stern_watch_net

  # --- Neo4j Graph Database ---
  neo4j:
    image: neo4j:5.18.0
    container_name: neo4j
    ports:
      - "7474:7474" # HTTP Web UI Browser
      - "7687:7687" # Bolt Protocol Port
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    networks:
      - stern_watch_net

  # --- PostgreSQL Lakehouse / pgvector ---
  postgres:
    image: pgvector/pgvector:pg16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: control_tower_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - stern_watch_net

  # --- Redis Session & State Cache ---
  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - stern_watch_net

  # --- Streamlit Control Tower Application ---
  streamlit_ui:
    build:
      context: ..
      dockerfile: deployment/docker/Dockerfile.streamlit
    container_name: streamlit_control_tower
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    depends_on:
      - kafka
      - neo4j
      - postgres
      - redis
    networks:
      - stern_watch_net

networks:
  stern_watch_net:
    driver: bridge

volumes:
  neo4j_data:
  postgres_data: