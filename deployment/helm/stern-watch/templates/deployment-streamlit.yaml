apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-streamlit
  labels:
    app: stern-watch-ui
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: stern-watch-ui
  template:
    metadata:
      labels:
        app: stern-watch-ui
    spec:
      containers:
        - name: streamlit
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8501
          resources:
            {{- toYaml .Values.resources | nindent 12 }}