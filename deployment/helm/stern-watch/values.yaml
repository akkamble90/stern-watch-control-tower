replicaCount: 3

image:
  repository: registry.enterprise.mercedes-benz.com/stern-watch/ui
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8501

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

env:
  GROQ_API_KEY: "secret"
  NEO4J_URI: "bolt://neo4j-service:7687"
  POSTGRES_HOST: "postgres-service"