[metadata]
name = stern-watch-control-tower
version = 0.1.0
description = Enterprise AI-Driven Intelligent Supply Chain Control Tower

[tool:pytest]
testpaths = tests
python_files = test_*.py
addopts = -v --strict-markers
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests

[coverage:run]
source = src
omit =
    */tests/*
    */config/*