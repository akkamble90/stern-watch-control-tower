[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stern-watch-control-tower"
version = "0.1.0"
description = "Enterprise AI-Driven Intelligent Supply Chain Control Tower for Automotive Manufacturing"
readme = "README.md"
authors = [{ name = "Akhil Kamble", email = "akhil@example.com" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.35.0",
    "pyspark>=3.5.0",
    "kafka-python>=2.0.2",
    "langchain>=0.2.0",
    "langgraph>=0.0.60",
    "langchain-groq>=0.1.3",
    "neo4j>=5.20.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "xgboost>=2.0.3",
    "prophet>=1.1.5",
    "pydeck>=0.8.1b0",
    "msal>=1.28.0",
    "requests>=2.31.0",
    "redis>=5.0.0",
    "scipy>=1.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=24.3.0",
    "ruff>=0.3.0",
    "mlflow>=2.11.0"
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"